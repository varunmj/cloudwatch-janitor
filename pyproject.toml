[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudwatch-janitor"
version = "0.1.0"
description = "Read-only CLI that audits an AWS account for CloudWatch waste and estimates monthly savings."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["boto3>=1.34"]
authors = [{ name = "Varun Mohankumar" }]
keywords = ["aws", "cloudwatch", "cost-optimization", "finops", "cloud-costs", "logs", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/varunmj/cloudwatch-janitor"
Repository = "https://github.com/varunmj/cloudwatch-janitor"
Issues = "https://github.com/varunmj/cloudwatch-janitor/issues"

[project.scripts]
cloudwatch-janitor = "cw_janitor.cli:main"

[tool.setuptools.packages.find]
include = ["cw_janitor*"]

[tool.ruff]
line-length = 100
