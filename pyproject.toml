[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudwatch-janitor"
version = "0.1.0"
description = "Read-only CLI that audits an AWS account for CloudWatch waste and estimates monthly savings."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["boto3>=1.34"]

[project.scripts]
cloudwatch-janitor = "cw_janitor.cli:main"

[tool.setuptools.packages.find]
include = ["cw_janitor*"]

[tool.ruff]
line-length = 100
